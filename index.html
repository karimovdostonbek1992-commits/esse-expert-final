<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EssayLab AI - Neon Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="mode-uz">

    <div class="nav-container">
        <button onclick="toggleTheme()" class="glass-nav-btn">
            <i id="themeIcon" class="fas fa-moon text-yellow-400"></i>
        </button>
        <div class="lang-wrapper">
            <button onclick="setMode('uz')" id="btnUz" class="glass-nav-btn">UZ</button>
            <button onclick="setMode('en')" id="btnEn" class="glass-nav-btn">EN</button>
            <button onclick="setMode('ru')" id="btnRu" class="glass-nav-btn">RU</button>
        </div>
    </div>

    <div id="authModal" class="fixed inset-0 z-[5000] flex items-center justify-center bg-[#020c1b] p-4">
        <div class="glass-card p-10 max-w-md w-full text-center border-t-4 border-[var(--t-color)]">
            <h1 class="text-4xl font-black mb-6 theme-text italic tracking-tighter">EssayLab AI</h1>
            <input id="regEmail" type="email" class="w-full p-4 rounded-xl bg-white/5 border border-white/10 outline-none mb-6 focus:border-[var(--t-color)] transition" placeholder="Emailingizni kiriting...">
            <button onclick="registerUser()" class="w-full neon-glow py-4 rounded-xl font-black text-white btn-pulse uppercase tracking-widest">Kirish</button>
        </div>
    </div>

    <main id="mainContent" class="opacity-0 transition-opacity duration-1000 max-w-5xl mx-auto p-4 pt-24">
        
        <div class="text-center mb-12">
            <h1 id="mainTitle" class="text-5xl md:text-6xl font-black mb-4 tracking-tighter"></h1>
            <p id="userTag" class="text-[10px] font-bold opacity-50 tracking-[0.5em] uppercase"></p>
        </div>

        <div class="glass-card p-8 md:p-12 mb-12">
            <input id="topicInput" type="text" class="w-full bg-transparent border-b border-white/10 p-4 mb-8 outline-none font-bold text-2xl text-[var(--t-color)]">
            <textarea id="essayInput" class="w-full h-80 bg-transparent outline-none resize-none leading-relaxed text-xl" placeholder="..."></textarea>
            
            <div class="flex flex-col md:flex-row justify-between items-center mt-8 pt-8 border-t border-white/5 gap-6">
                <div class="theme-text font-black text-sm tracking-widest italic">
                    <span id="wordCount">0</span> <span id="wordLabel"></span>
                </div>
                <button id="checkBtn" class="neon-glow px-16 py-5 rounded-2xl font-black text-white uppercase tracking-widest text-lg"></button>
            </div>
        </div>

        <div id="resultBox" class="hidden glass-card p-10 mb-12 border-l-[12px] border-[var(--t-color)] animate-slide-up">
            <div id="resultContent" class="text-xl leading-loose opacity-90"></div>
        </div>

        <div class="glass-card p-12 text-center border-b-4 border-[var(--t-color)]">
            <div class="flex justify-between items-center mb-10">
                <h2 id="speakingTitle" class="text-3xl font-black theme-text italic"></h2>
                <button onclick="setRandomTopic()" class="text-[var(--t-color)] text-2xl hover:rotate-180 transition-all duration-500">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <p id="speakingQuestion" class="text-2xl font-bold mb-12 opacity-80 italic"></p>
            
            <div class="flex flex-col items-center gap-6">
                <div class="relative">
                    <div id="micRipple" class="absolute inset-0 bg-[var(--t-color)] rounded-full opacity-0"></div>
                    <button id="recordBtn" class="relative z-10 w-32 h-32 rounded-full neon-glow flex items-center justify-center text-4xl text-white">
                        <i id="micIcon" class="fas fa-microphone"></i>
                    </button>
                </div>
                <div id="recordingStatus" class="font-black text-xs tracking-[0.3em] opacity-40 uppercase mt-4"></div>
            </div>

            <div id="speakingResult" class="hidden mt-12 text-left border-t border-white/10 pt-10">
                <p id="transcript" class="italic opacity-40 mb-8 text-sm border-l-2 border-white/20 pl-4"></p>
                <div id="speakingFeedback" class="text-lg leading-relaxed"></div>
            </div>
        </div>
    </main>

    <div id="loader" class="hidden fixed inset-0 z-[6000] flex flex-col items-center justify-center bg-[#020c1b]/95 backdrop-blur-xl">
        <div class="w-20 h-20 border-t-4 border-b-4 border-[var(--t-color)] rounded-full animate-spin mb-8"></div>
        <p id="loaderText" class="theme-text font-black tracking-[0.5em] text-xs uppercase"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
