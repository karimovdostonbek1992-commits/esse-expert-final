<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EssayLab AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS-ni to'g'ridan-to'g'ri shu yerga yozamiz, shunda buzilmaydi */
        :root { --p: #00ff88; --bg: #020c1b; --c: rgba(15, 23, 42, 0.9); }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; }
        .neon-card { background: var(--c); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; margin-bottom: 20px; }
        .neon-btn { background: var(--p); color: black; font-weight: 900; padding: 15px 30px; border-radius: 12px; transition: 0.3s; cursor: pointer; border: none; }
        .neon-btn:hover { box-shadow: 0 0 20px var(--p); transform: translateY(-2px); }
        .input-dark { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; padding: 15px; outline: none; margin-bottom: 15px; }
        .nav { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
        .lang-btn { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        .active-lang { background: var(--p); color: black; font-weight: bold; }
        .loader { position: fixed; inset: 0; background: rgba(2,12,27,0.9); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="nav">
        <button onclick="setMode('uz')" id="btnuz" class="lang-btn active-lang">UZ</button>
        <button onclick="setMode('en')" id="btnen" class="lang-btn">EN</button>
        <button onclick="setMode('ru')" id="btnru" class="lang-btn">RU</button>
    </div>

    <div id="auth" class="fixed inset-0 bg-[#020c1b] z-[500] flex items-center justify-center p-4">
        <div class="neon-card text-center max-w-sm w-full">
            <h1 style="color:var(--p); font-size: 2.5rem; font-weight: 900; margin-bottom: 20px;">EssayLab AI</h1>
            <input id="email" type="email" placeholder="Emailni kiriting" class="input-dark">
            <button onclick="login()" class="neon-btn w-full">KIRISH</button>
        </div>
    </div>

    <main id="app" class="hidden max-w-4xl mx-auto pt-28 px-4">
        <div class="text-center mb-10">
            <h1 id="title" class="text-4xl font-black mb-2 tracking-tighter">WRITING AI</h1>
            <p id="user" class="text-xs opacity-50 tracking-widest"></p>
        </div>

        <div class="neon-card">
            <input id="topic" type="text" placeholder="Mavzu..." class="input-dark text-xl font-bold border-b border-white/20">
            <textarea id="essay" placeholder="Esseingizni yozing..." class="input-dark h-80 resize-none"></textarea>
            <div class="flex justify-between items-center">
                <span style="color:var(--p); font-weight: bold;"><span id="words">0</span> SO'Z</span>
                <button onclick="checkEssay()" class="neon-btn">TAHLIL QILISH</button>
            </div>
        </div>

        <div id="res" class="hidden neon-card border-l-8 border-[#00ff88]">
            <div id="resContent" class="text-lg leading-relaxed"></div>
        </div>

        <div class="neon-card text-center">
            <h2 style="color:var(--p)" class="text-2xl font-bold mb-6 italic">Speaking Coach</h2>
            <p id="q" class="text-xl font-bold mb-8 opacity-80 italic">Mavzu yuklanmoqda...</p>
            <button id="mic" onclick="toggleMic()" class="w-24 h-24 rounded-full neon-btn text-3xl">
                <i class="fas fa-microphone"></i>
            </button>
            <p id="status" class="mt-4 text-xs opacity-40 uppercase tracking-widest">Boshlash uchun bosing</p>
        </div>
    </main>

    <div id="ld" class="hidden loader">
        <div class="w-12 h-12 border-4 border-[#00ff88] border-t-transparent rounded-full animate-spin mb-4"></div>
        <p style="color:var(--p); font-weight: 900; letter-spacing: 2px;">AI TAHLIL QILMOQDA...</p>
    </div>

    <script>
        const KEY = "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";
        let mode = 'uz';
        let rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
        rec.continuous = true;

        const db = {
            uz: ["Sun'iy intellektning foydasi", "Ekologiya va biz", "Kitobxonlikning foydasi"],
            en: ["Impact of AI", "Climate change issues", "Benefits of reading"],
            ru: ["Влияние ИИ", "Проблемы экологии", "Польза чтения"]
        };

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-lang'));
            document.getElementById('btn' + m).classList.add('active-lang');
            document.getElementById('q').innerText = db[m][Math.floor(Math.random() * 3)];
        }

        function login() {
            const e = document.getElementById('email').value;
            if(!e.includes('@')) return alert("Email xato!");
            document.getElementById('auth').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('user').innerText = e.toUpperCase();
            setMode('uz');
        }

        async function checkEssay() {
            const t = document.getElementById('essay').value;
            if(t.length < 10) return;
            document.getElementById('ld').classList.remove('hidden');
            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role: "user", content: `Tahlil qil (${mode}): ${t}`}]})
            });
            const d = await r.json();
            document.getElementById('res').classList.remove('hidden');
            document.getElementById('resContent').innerHTML = d.choices[0].message.content.replace(/\n/g, '<br>');
            document.getElementById('ld').classList.add('hidden');
        }

        function toggleMic() {
            try { rec.start(); document.getElementById('status').innerText = "AI ESHITMOQDA..."; } 
            catch(e) { rec.stop(); document.getElementById('status').innerText = "BOSHLASH UCHUN BOSING"; }
        }

        document.getElementById('essay').oninput = function() {
            document.getElementById('words').innerText = this.value.trim().split(/\s+/).length;
        };
    </script>
</body>
</html>
