<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EssayLab AI - Cyber PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon: #00ff88;
            --bg: #020c1b;
            --glass: rgba(15, 23, 42, 0.7);
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            transition: background 0.5s;
        }

        .light-mode {
            --bg: #f3f4f6;
            --glass: rgba(255, 255, 255, 0.9);
            color: #1f2937;
        }

        /* Video'dagi neon ramka */
        .cyber-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 2px solid var(--neon);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            border-radius: 25px;
        }

        /* Tugmalar yorqinligi */
        .neon-btn {
            background: var(--neon);
            color: #020c1b !important;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .neon-btn:hover {
            box-shadow: 0 0 30px var(--neon);
            transform: translateY(-2px);
        }

        .cyber-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
        }
        .light-mode .cyber-input { background: #fff; color: #000; border-color: #ccc; }
        .cyber-input:focus { border-color: var(--neon); box-shadow: 0 0 10px var(--neon); }

        .criteria-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            border-left: 5px solid var(--neon);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .active-lang { color: var(--neon) !important; border-bottom: 2px solid var(--neon); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="authPage" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#020c1b]">
        <div class="cyber-card p-10 max-w-sm w-full text-center">
            <h1 class="text-4xl font-black italic mb-8" style="color: var(--neon);">EssayLab AI</h1>
            <div class="space-y-4">
                <input id="inName" type="text" placeholder="Ism va Familiya" class="cyber-input w-full p-4">
                <input id="inAlias" type="text" placeholder="Username (Taxallus)" class="cyber-input w-full p-4">
                <input id="inEmail" type="email" placeholder="Email (user@gmail.com)" class="cyber-input w-full p-4">
                <button onclick="handleLogin()" class="neon-btn w-full py-4 mt-4 rounded-xl">KIRISH</button>
            </div>
        </div>
    </div>

    <main id="mainApp" class="hidden max-w-2xl mx-auto pt-8 px-4 pb-20">
        <div class="flex justify-between items-center mb-8">
            <button onclick="toggleMode()" class="w-10 h-10 rounded-full flex items-center justify-center glass">
                <i id="modeIcon" class="fas fa-moon text-yellow-400"></i>
            </button>
            <div class="flex gap-4 font-bold text-sm">
                <button onclick="setLang('uz')" id="uz" class="active-lang">UZ</button>
                <button onclick="setLang('en')" id="en" class="opacity-50">EN</button>
                <button onclick="setLang('ru')" id="ru" class="opacity-50">RU</button>
            </div>
        </div>

        <div class="text-center mb-8">
            <h2 id="sectionTitle" class="text-3xl font-bold mb-1">Milliy sertifikat bo'limi</h2>
            <p id="profileBadge" class="text-[10px] tracking-widest opacity-50 uppercase text-[#00ff88]"></p>
        </div>

        <div class="cyber-card p-6 mb-8">
            <input id="topicTitle" type="text" placeholder="Esse mavzusi..." class="w-full bg-transparent border-none outline-none text-xl font-bold mb-2">
            <div class="h-[1px] bg-white/10 w-full mb-6"></div>
            <textarea id="essayText" placeholder="Matnni shu yerga yozing..." class="w-full h-64 bg-transparent outline-none resize-none leading-relaxed text-lg"></textarea>
            
            <div class="flex justify-between items-center mt-6">
                <div class="font-bold text-[#00ff88]"><span id="charCount">0</span> SO'Z</div>
                <button onclick="startAnalyze()" class="neon-btn px-10 py-3 rounded-xl">TAHLIL QILISH</button>
            </div>
        </div>

        <div class="mt-10">
            <h3 class="text-xs font-bold tracking-[0.3em] opacity-40 uppercase mb-4">Mezonlar va ballar</h3>
            <div id="criteriaContainer">
                <div class="criteria-item"><span>MAVZU (4 BALL)</span> <i class="fas fa-check-circle text-[#00ff88]"></i></div>
                <div class="criteria-item"><span>MANTIQ (3 BALL)</span> <i class="fas fa-check-circle text-[#00ff88]"></i></div>
                <div class="criteria-item"><span>IMLO (3 BALL)</span> <i class="fas fa-check-circle text-[#00ff88]"></i></div>
                <div class="criteria-item"><span>TINISH (2 BALL)</span> <i class="fas fa-check-circle text-[#00ff88]"></i></div>
                <div class="criteria-item"><span>USLUB (3 BALL)</span> <i class="fas fa-check-circle text-[#00ff88]"></i></div>
            </div>
        </div>
    </main>

    <div id="loadingScreen" class="hidden fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-black/90 backdrop-blur-md">
        <div class="w-14 h-14 border-4 border-[#00ff88] border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-[#00ff88] font-bold tracking-widest animate-pulse uppercase">AI Tahlil qilmoqda...</p>
    </div>

    <script>
        const API_TOKEN = "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";

        // KIRISH FUNKSIYASI
        function handleLogin() {
            const name = document.getElementById('inName').value;
            const alias = document.getElementById('inAlias').value;
            const email = document.getElementById('inEmail').value;

            if (name === "" || email === "") {
                alert("Iltimos, ism va emailni to'ldiring!");
                return;
            }

            // Sahifalarni almashtirish
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            
            // Profil ma'lumotini o'rnatish
            document.getElementById('profileBadge').innerText = `@${alias} | ${email}`;
        }

        // TILLARNI ALMASHTIRISH
        function setLang(l) {
            document.querySelectorAll('.flex button').forEach(b => b.classList.add('opacity-50', 'border-none'));
            document.querySelectorAll('.flex button').forEach(b => b.classList.remove('active-lang', 'opacity-100'));
            
            const btn = document.getElementById(l);
            btn.classList.add('active-lang', 'opacity-100');
            btn.classList.remove('opacity-50');

            const titles = {
                uz: "Milliy sertifikat bo'limi",
                en: "IELTS Exam Center",
                ru: "Национальный сертификат (RU)"
            };
            document.getElementById('sectionTitle').innerText = titles[l];
        }

        // TAHLIL
        async function startAnalyze() {
            const text = document.getElementById('essayText').value;
            if (text.length < 10) {
                alert("Tahlil uchun kamida 10 ta so'z yozing!");
                return;
            }

            document.getElementById('loadingScreen').classList.remove('hidden');
            
            try {
                // AI ga so'rov yuborish qismi (Test rejimida)
                setTimeout(() => {
                    document.getElementById('loadingScreen').classList.add('hidden');
                    alert("AI tahlilni yakunladi! Natijalar mezonlar bo'limida yangilandi.");
                }, 2000);
            } catch (err) {
                document.getElementById('loadingScreen').classList.add('hidden');
                alert("Xatolik yuz berdi.");
            }
        }

        // KUN/TUN REJIMI
        function toggleMode() {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('modeIcon');
            if (document.body.classList.contains('light-mode')) {
                icon.className = "fas fa-sun text-orange-500";
            } else {
                icon.className = "fas fa-moon text-yellow-400";
            }
        }

        // SO'ZLARNI SANASH
        document.getElementById('essayText').addEventListener('input', function() {
            const words = this.value.trim().split(/\s+/).filter(w => w.length > 0).length;
            document.getElementById('charCount').innerText = words;
        });
    </script>
</body>
</html>
