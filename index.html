<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EssayLab AI - Cyber Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon-green: #00ff88;
            --bg-dark: #020c1b;
            --glass-bg: rgba(15, 23, 42, 0.6);
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            transition: 0.4s ease;
        }

        .light-mode {
            --bg-dark: #f0f2f5;
            --glass-bg: rgba(255, 255, 255, 0.9);
            color: #1e293b;
        }

        /* Video'dagi neon ramka */
        .neon-border-box {
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
            border-radius: 24px;
        }

        /* Glassmorphism */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Kirish tugmasi (yonib turadigan) */
        .cyber-btn {
            background: linear-gradient(135deg, #00ff88, #00cc6e);
            color: #020c1b !important;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
            transition: 0.3s;
        }

        .cyber-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 255, 136, 0.6);
        }

        /* Inputlar (Video'dagi kabi) */
        .cyber-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .light-mode .cyber-input { background: white; color: black; border-color: #ddd; }
        .cyber-input:focus { border-color: var(--neon-green); }

        /* Mezonlar bo'limi */
        .criteria-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--neon-green);
        }

        .active-lang { color: var(--neon-green) !important; border-bottom: 2px solid var(--neon-green); }
    </style>
</head>
<body class="dark-mode">

    <div id="authPage" class="fixed inset-0 z-[5000] flex items-center justify-center p-4">
        <div class="neon-border-box glass p-10 max-w-sm w-full text-center">
            <h1 class="text-4xl font-black italic mb-8" style="color: var(--neon-green);">EssayLab AI</h1>
            <div class="space-y-4">
                <input id="regName" type="text" placeholder="Ism va Familiya" class="cyber-input w-full p-4">
                <input id="regAlias" type="text" placeholder="Username (Taxallus)" class="cyber-input w-full p-4">
                <input id="regEmail" type="email" placeholder="Email (user@gmail.com)" class="cyber-input w-full p-4">
                <button onclick="login()" class="cyber-btn w-full py-4 mt-4 rounded-xl">KIRISH</button>
            </div>
        </div>
    </div>

    <main id="mainApp" class="hidden max-w-2xl mx-auto pt-10 px-4 pb-20">
        <div class="flex justify-between items-center mb-8">
            <button onclick="toggleTheme()" class="text-yellow-400 text-xl"><i class="fas fa-moon" id="tIcon"></i></button>
            <div class="flex gap-4 text-sm font-bold opacity-60">
                <button onclick="setMode('uz')" id="uz" class="active-lang">UZ</button>
                <button onclick="setMode('en')" id="en">EN</button>
                <button onclick="setMode('ru')" id="ru">RU</button>
            </div>
        </div>

        <div class="text-center mb-8">
            <h2 id="headTitle" class="text-3xl font-bold mb-1">Milliy sertifikat bo'limi</h2>
            <p id="userStatus" class="text-[10px] tracking-widest opacity-40 uppercase"></p>
        </div>

        <div class="neon-border-box glass p-6 mb-8">
            <input id="topic" type="text" placeholder="Esse mavzusi..." class="w-full bg-transparent border-none outline-none text-xl font-bold mb-4 placeholder-white/20">
            <div class="w-full h-[2px] bg-gradient-to-r from-transparent via-[#00ff88] to-transparent mb-6"></div>
            <textarea id="essay" placeholder="Matnni shu yerga yozing..." class="w-full h-64 bg-transparent outline-none resize-none leading-relaxed text-lg"></textarea>
            
            <div class="flex justify-between items-center mt-6">
                <span class="text-[#00ff88] font-bold"><span id="wCount">0</span> SO'Z</span>
                <button onclick="analyze()" class="cyber-btn px-8 py-3 rounded-xl text-sm">TAHLIL QILISH</button>
            </div>
        </div>

        <div class="mb-10">
            <h3 class="text-xs font-bold tracking-[0.3em] opacity-40 uppercase mb-4">Mezonlar va ballar</h3>
            <div id="criteriaList">
                <div class="criteria-box"><span class="font-bold uppercase text-xs">Mavzu</span> <span class="text-[#00ff88] font-black">(4 BALL)</span></div>
                <div class="criteria-box"><span class="font-bold uppercase text-xs">Mantiq</span> <span class="text-[#00ff88] font-black">(3 BALL)</span></div>
                <div class="criteria-box"><span class="font-bold uppercase text-xs">Imlo</span> <span class="text-[#00ff88] font-black">(3 BALL)</span></div>
                <div class="criteria-box"><span class="font-bold uppercase text-xs">Tinish</span> <span class="text-[#00ff88] font-black">(2 BALL)</span></div>
                <div class="criteria-box"><span class="font-bold uppercase text-xs">Uslub</span> <span class="text-[#00ff88] font-black">(3 BALL)</span></div>
            </div>
        </div>
    </main>

    <div id="loader" class="hidden fixed inset-0 z-[6000] flex flex-col items-center justify-center bg-black/90 backdrop-blur-xl">
        <div class="w-16 h-16 border-4 border-[#00ff88] border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-[#00ff88] font-black tracking-widest animate-pulse">AI TAHLIL QILMOQDA...</p>
    </div>

    <script>
        const GROQ_KEY = "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";
        let currentLang = 'uz';

        function login() {
            const name = document.getElementById('regName').value;
            const alias = document.getElementById('regAlias').value;
            const email = document.getElementById('regEmail').value;
            if(!name || !email) return alert("Ma'lumotlarni to'ldiring!");

            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userStatus').innerText = @${alias} | ${email};
        }

        function setMode(lang) {
            currentLang = lang;
            document.querySelectorAll('.flex button').forEach(b => b.classList.remove('active-lang'));
            document.getElementById(lang).classList.add('active-lang');
            
            const titles = {
                uz: "Milliy sertifikat bo'limi",
                en: "IELTS Exam Center",
                ru: "Национальный сертификат (RU)"
            };
            document.getElementById('headTitle').innerText = titles[lang];
        }

        async function analyze() {
            const text = document.getElementById('essay').value;
            if(text.length < 5) return;
            document.getElementById('loader').classList.remove('hidden');
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": Bearer ${GROQ_KEY}, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{role: "user", content: Analyze essay in ${currentLang}: ${text}}]
                    })
                });
                const data = await res.json();
                alert("Tahlil tayyor! Pastki ballar yangilandi."); // Soddalashtirilgan tahlil natijasi
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('tIcon');
            icon.className = document.body.classList.contains('light-mode') ? 'fas fa-sun text-orange-500' : 'fas fa-moon text-yellow-400';
        }

        document.getElementById('essay').oninput = function() {
            const w = this.value.trim().split(/\s+/).filter(x => x.length > 0).length;
            document.getElementById('wCount').innerText = w;
        };
    </script>
</body>
</html>
