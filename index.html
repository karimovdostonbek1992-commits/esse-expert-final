<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EssayLab AI Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="mode-uz">

    <div class="nav-container">
        <button id="menuBtn" class="glass-nav-btn text-xl"><i class="fas fa-bars"></i></button>
        <div class="flex gap-2">
            <button onclick="toggleTheme()" class="glass-nav-btn"><i id="themeIcon" class="fas fa-moon text-yellow-400"></i></button>
            <div class="lang-wrapper">
                <button onclick="setMode('uz')" id="btnUz" class="glass-nav-btn">UZ</button>
                <button onclick="setMode('en')" id="btnEn" class="glass-nav-btn">EN</button>
                <button onclick="setMode('ru')" id="btnRu" class="glass-nav-btn">RU</button>
            </div>
        </div>
    </div>

    <div id="sidebar" class="sidebar">
        <div class="p-8 pt-24">
            <h2 class="text-2xl font-black theme-text mb-10 italic">Menu</h2>
            <nav class="flex flex-col gap-4">
                <button onclick="switchTab('writing')" class="menu-item"><i class="fas fa-pen-nib"></i> Writing</button>
                <button onclick="switchTab('speaking')" class="menu-item"><i class="fas fa-microphone"></i> Speaking</button>
            </nav>
        </div>
    </div>

    <div id="authModal" class="fixed inset-0 z-[4000] flex items-center justify-center bg-[#020c1b] p-4">
        <div class="glass-card p-10 max-w-md w-full text-center border-t-4 border-[var(--t-color)]">
            <h1 class="text-4xl font-black mb-6 theme-text tracking-tighter italic">EssayLab AI</h1>
            <div class="space-y-4 mb-8">
                <input id="regName" type="text" class="auth-input" placeholder="Ism va Familiya">
                <input id="regAlias" type="text" class="auth-input" placeholder="Username">
                <input id="regEmail" type="email" class="auth-input" placeholder="Email">
            </div>
            <button onclick="registerUser()" class="w-full neon-glow py-4 rounded-xl font-black text-white btn-pulse">KIRISH</button>
        </div>
    </div>

    <main id="mainContent" class="opacity-0 transition-opacity duration-1000 max-w-6xl mx-auto p-4 pt-28">
        
        <section id="writingPage" class="content-section">
            <div class="text-center mb-12">
                <h1 id="mainTitle" class="text-5xl font-black mb-2 tracking-tight"></h1>
                <p id="userTag" class="text-[10px] font-bold opacity-40 tracking-[0.3em] uppercase"></p>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-8 space-y-6">
                    <div class="glass-card p-8">
                        <input id="topicInput" type="text" class="w-full bg-transparent border-b border-white/10 p-4 mb-6 outline-none font-bold text-xl" placeholder="">
                        <textarea id="essayInput" class="w-full h-96 bg-transparent outline-none resize-none leading-relaxed text-lg" placeholder=""></textarea>
                        <div class="flex justify-between items-center mt-6 pt-6 border-t border-white/5">
                            <div class="theme-text font-black text-xs tracking-widest"><span id="wordCount">0</span> <span id="wordLabel"></span></div>
                            <button id="checkBtn" class="neon-glow px-12 py-4 rounded-2xl font-black text-white uppercase tracking-widest"></button>
                        </div>
                    </div>
                    <div id="resultBox" class="hidden glass-card p-8 border-l-[12px] border-[var(--t-color)] animate-fade-in">
                        <div id="resultContent" class="text-lg leading-loose opacity-90"></div>
                    </div>
                </div>
                
                <div class="lg:col-span-4">
                    <div class="glass-card p-6 sticky top-28">
                        <h3 id="critTitle" class="text-[10px] font-black opacity-40 mb-6 tracking-[0.2em] uppercase"></h3>
                        <div id="criteriaList" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="speakingPage" class="content-section hidden">
            <div class="glass-card p-12 text-center max-w-2xl mx-auto">
                <div class="flex justify-between items-center mb-8">
                    <h2 id="speakingTitle" class="text-3xl font-black theme-text italic"></h2>
                    <button onclick="generateNewTopic()" class="hover:rotate-180 transition-transform duration-500 theme-text text-xl"><i class="fas fa-sync-alt"></i></button>
                </div>
                <p id="speakingQuestion" class="text-2xl font-bold mb-12 opacity-80 leading-snug"></p>
                
                <div class="relative inline-block mb-10">
                    <div id="micRipple" class="absolute inset-0 bg-[var(--t-color)] rounded-full opacity-0"></div>
                    <button id="startRecordBtn" onclick="startRecording()" class="relative z-10 w-32 h-32 rounded-full neon-glow flex items-center justify-center text-4xl text-white">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button id="stopRecordBtn" onclick="stopRecording()" class="hidden relative z-10 w-32 h-32 rounded-full bg-red-600 flex items-center justify-center text-4xl text-white shadow-[0_0_30px_rgba(220,38,38,0.5)]">
                        <i class="fas fa-stop"></i>
                    </button>
                </div>
                <div id="recordingStatus" class="font-black text-xs tracking-widest opacity-40 uppercase"></div>
                
                <div id="speakingResult" class="hidden mt-12 text-left border-t border-white/10 pt-8">
                    <p id="transcript" class="italic opacity-50 mb-6 text-sm"></p>
                    <div id="speakingFeedback" class="text-lg leading-relaxed"></div>
                </div>
            </div>
        </section>

    </main>

    <div id="loader" class="hidden fixed inset-0 z-[5000] flex flex-col items-center justify-center bg-[#020c1b]/90 backdrop-blur-md">
        <div class="w-12 h-12 border-4 border-[var(--t-color)] border-t-transparent rounded-full animate-spin mb-6"></div>
        <p id="loaderText" class="theme-text font-black tracking-[0.4em] text-xs"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
