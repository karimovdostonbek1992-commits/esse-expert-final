<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EssayLab AI - Original Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* ASOSIY STILLAR - BUZILMASLIGI UCHUN */
        :root {
            --neon: #00ff88;
            --bg: #020c1b;
            --card: rgba(10, 25, 47, 0.85);
        }

        body {
            background-color: var(--bg);
            color: #e6f1ff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.1), transparent 50%);
            background-attachment: fixed;
        }

        .neon-border {
            border: 1px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.05);
        }

        .glass-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .neon-button {
            background: var(--neon);
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s all;
        }

        .neon-button:hover {
            box-shadow: 0 0 25px var(--neon);
            transform: translateY(-2px);
        }

        .input-style {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: 0.3s;
        }

        .input-style:focus {
            border-color: var(--neon);
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }

        /* Yuklanish animatsiyasi */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(0, 255, 136, 0.1);
            border-top: 4px solid var(--neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>

    <nav class="fixed top-6 right-6 z-50 flex gap-2">
        <button onclick="changeLang('uz')" class="px-4 py-2 glass-card text-xs font-bold hover:text-[#00ff88]">UZ</button>
        <button onclick="changeLang('en')" class="px-4 py-2 glass-card text-xs font-bold hover:text-[#00ff88]">EN</button>
        <button onclick="changeLang('ru')" class="px-4 py-2 glass-card text-xs font-bold hover:text-[#00ff88]">RU</button>
    </nav>

    <div id="authModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#020c1b]">
        <div class="glass-card p-10 max-w-md w-full text-center neon-border">
            <h1 class="text-4xl font-black mb-8 italic text-[#00ff88]">EssayLab AI</h1>
            <input id="userEmail" type="email" placeholder="Email manzilingiz" class="input-style w-full p-4 rounded-xl mb-4 text-center">
            <button onclick="startApp()" class="neon-button w-full py-4 rounded-xl">Kirish</button>
        </div>
    </div>

    <main id="mainApp" class="hidden opacity-0 transition-opacity duration-1000 max-w-4xl mx-auto py-20 px-4">
        
        <div class="text-center mb-12">
            <h2 id="pageTitle" class="text-5xl font-black tracking-tighter mb-2">WRITING CENTER</h2>
            <p id="userStatus" class="text-[10px] opacity-40 tracking-[5px] uppercase"></p>
        </div>

        <div class="glass-card p-8 mb-8 neon-border">
            <input id="topic" type="text" placeholder="Esse mavzusi..." class="input-style w-full p-4 rounded-xl mb-4 font-bold text-lg">
            <textarea id="essay" placeholder="Matnni shu yerga kiriting..." class="input-style w-full h-80 p-6 rounded-xl resize-none mb-4 leading-relaxed"></textarea>
            
            <div class="flex justify-between items-center">
                <div class="text-[#00ff88] font-bold text-sm">
                    <span id="wordCount">0</span> SO'Z
                </div>
                <button onclick="analyzeEssay()" class="neon-button px-10 py-4 rounded-xl">Tahlil qilish</button>
            </div>
        </div>

        <div id="resultBox" class="hidden glass-card p-8 mb-12 border-l-4 border-[#00ff88]">
            <h3 class="text-[#00ff88] font-bold mb-4">AI TAHLILI:</h3>
            <div id="resultContent" class="text-lg leading-relaxed opacity-90"></div>
        </div>

        <div class="glass-card p-10 text-center neon-border">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-black italic">AI SPEAKING</h3>
                <button onclick="newTopic()" class="text-[#00ff88] hover:rotate-180 transition-transform duration-500">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <p id="speakingTopic" class="text-xl font-bold mb-10 opacity-80 min-h-[60px]"></p>
            
            <div class="flex flex-col items-center gap-4">
                <button id="micBtn" onclick="toggleSpeech()" class="w-24 h-24 rounded-full neon-button text-3xl flex items-center justify-center">
                    <i id="micIcon" class="fas fa-microphone"></i>
                </button>
                <p id="micStatus" class="text-[10px] opacity-40 tracking-widest uppercase">Tugmani bosing va gapiring</p>
            </div>
        </div>
    </main>

    <div id="loader" class="hidden fixed inset-0 z-[200] flex flex-col items-center justify-center bg-[#020c1b]/90 backdrop-blur-sm">
        <div class="spinner mb-4"></div>
        <p class="text-[#00ff88] font-bold tracking-widest text-xs">AI ISHLAMOQDA...</p>
    </div>

    <script>
        const API_KEY = "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";
        let currentLang = 'uz';
        let isRecording = false;

        // 100 ta mavzu uchun baza (namuna)
        const topicDB = {
            uz: ["Global isish haqida gapiring.", "Kitob o'qishning foydalari.", "Sizning eng sevimli sayohat joyingiz.", "Sun'iy intellekt kelajagi.", "Sog'lom turmush tarzi."],
            en: ["Talk about global warming.", "Benefits of reading books.", "Your favorite travel destination.", "The future of AI.", "Healthy lifestyle."],
            ru: ["О глобальном потеплении.", "Польза чтения книг.", "Ваше любимое место для путешествий.", "Будущее ИИ.", "Здоровый образ жизни."]
        };

        function startApp() {
            const email = document.getElementById('userEmail').value;
            if(!email.includes('@')) return alert("Email xato!");
            
            document.getElementById('authModal').classList.add('hidden');
            const main = document.getElementById('mainApp');
            main.classList.remove('hidden');
            setTimeout(() => main.classList.add('opacity-100'), 100);
            document.getElementById('userStatus').innerText = email;
            newTopic();
        }

        function changeLang(lang) {
            currentLang = lang;
            newTopic();
            document.getElementById('pageTitle').innerText = lang === 'uz' ? 'WRITING MARKAZI' : (lang === 'en' ? 'WRITING CENTER' : 'ЦЕНТР ПИСЬМА');
        }

        function newTopic() {
            const list = topicDB[currentLang];
            document.getElementById('speakingTopic').innerText = list[Math.floor(Math.random() * list.length)];
        }

        async function analyzeEssay() {
            const text = document.getElementById('essay').value;
            if(text.length < 10) return alert("Matn kiriting!");

            document.getElementById('loader').classList.remove('hidden');
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: `Tahlil qil (${currentLang}): ${text}` }]
                    })
                });
                const data = await response.json();
                document.getElementById('resultBox').classList.remove('hidden');
                document.getElementById('resultContent').innerHTML = data.choices[0].message.content.replace(/\n/g, '<br>');
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        // Oddiy Nutqni aniqlash
        let recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
        recognition.onresult = (e) => {
            const result = e.results[0][0].transcript;
            alert("Siz aytdingiz: " + result);
        };

        function toggleSpeech() {
            if(!isRecording) {
                recognition.start();
                document.getElementById('micIcon').className = "fas fa-stop text-red-500";
                isRecording = true;
            } else {
                recognition.stop();
                document.getElementById('micIcon').className = "fas fa-microphone";
                isRecording = false;
            }
        }

        document.getElementById('essay').oninput = function() {
            const words = this.value.trim().split(/\s+/).filter(x => x.length > 0).length;
            document.getElementById('wordCount').innerText = words;
        };
    </script>
</body>
</html>
